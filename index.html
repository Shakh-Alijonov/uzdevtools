-cm':n*2.54};o.i.value=fn[sel.i.value].toFixed(4)}))}function dateTool(b){let a=field(t('date1'),'date'),c=field(t('date2'),'date'),o=field(t('result'));b.append(a.d,c.d,o.d,button(t('calculate'),()=>{if(a.i.value&&c.i.value)o.i.value=Math.abs((new Date(c.i.value)-new Date(a.i.value))/864e5)+' days'}))}function passwordTool(b){let n=field('Length','number',16,{min:4,max:128}),o=field(t('result'));b.append(n.d,o.d,button(t('apply'),()=>{let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';let arr=new Uint32Array(+n.i.value);crypto.getRandomValues(arr);o.i.value=Array.from(arr,x=>chars[x%chars.length]).join('')},'primary'),button(t('copy'),()=>copyText(o.i.value)))}function uuidTool(b){let o=field(t('result'));b.append(o.d,button(t('apply'),()=>o.i.value=crypto.randomUUID(),'primary'),button(t('copy'),()=>copyText(o.i.value)))}function qrTool(b){let f=field(t('input')),o=document.createElement('div');b.append(f.d,button(t('apply'),()=>{o.innerHTML='';let im=document.createElement('img');im.alt='QR code';im.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(f.i.value);im.className='preview';o.append(im)},'primary'),o);status(b,t('local'))}async function hashTool(b){let f=field(t('input'),'textarea','',{rows:4}),o=field(t('result'));b.append(f.d,o.d,button(t('apply'),async()=>{let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(f.i.value));o.i.value=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')},'primary'),button(t('copy'),()=>copyText(o.i.value)))}function textCountTool(b){let f=field(t('text'),'textarea','',{rows:7}),o=document.createElement('div');o.className='status';b.append(f.d,o);f.i.oninput=()=>{let x=f.i.value;o.innerHTML=`Characters: ${x.length}<br>Characters (no spaces): ${x.replace(/\s/g,'').length}<br>Words: ${(x.trim().match(/\S+/g)||[]).length}<br>Lines: ${x?x.split(/\r?\n/).length:0}`}}function caseTool(b){let f=field(t('text'),'textarea','',{rows:5}),o=field(t('result'),'textarea','',{rows:5});b.append(f.d,o.d,button('UPPERCASE',()=>o.i.value=f.i.value.toUpperCase()),button('lowercase',()=>o.i.value=f.i.value.toLowerCase()),button('Title Case',()=>o.i.value=f.i.value.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())),button(t('copy'),()=>copyText(o.i.value)))}function cleanTool(b){let f=field(t('text'),'textarea','',{rows:5}),o=field(t('result'),'textarea','',{rows:5});b.append(f.d,o.d,button(t('apply'),()=>o.i.value=f.i.value.split(/\r?\n/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n'),'primary'),button(t('copy'),()=>copyText(o.i.value)))}function phoneTool(b){let f=field(t('input'),'tel','',{placeholder:'+998 90 123 45 67'}),out=document.createElement('div');out.className='status';let note=document.createElement('p');note.className='note';note.textContent=t('phoneNote');b.append(f.d,out,note);function update(){let n=f.i.value.replace(/\D/g,'');if(n.startsWith('998'))n=n.slice(3);if(n.startsWith('0'))n=n.slice(1);if(n.length<2){out.textContent='';return}let code=n.slice(0,2),map={'20':'OQ','33':'Humans','50':'Ucell','55':'Ucell','77':'Uzmobile','88':'Mobiuz','90':'Beeline','91':'Beeline','93':'Ucell','94':'Ucell','95':'Uzmobile','97':'Mobiuz','98':'Perfectum','99':'Uzmobile'};let operator=map[code];if(n.length===9&&operator){out.className='status ok';out.textContent=`${t('phoneValid')}: +998 ${code} ${n.slice(2,5)} ${n.slice(5,7)} ${n.slice(7,9)} · ${t('operator')}: ${operator}`}else if(n.length===9){out.className='status error';out.textContent=t('phoneInvalid')}else{out.className='status';out.textContent=operator?`${t('prefix')}: ${code} · ${t('operator')}: ${operator}`:`${t('prefix')}: ${code}`}}f.i.oninput=update;update()}
function percentTool(b){let a=field('Percent (%)','number',10),c=field('Value','number',200),o=field(t('result'));b.append(a.d,c.d,o.d,button(t('calculate'),()=>o.i.value=(+a.i.value*+c.i.value/100).toString()))}function vatTool(b){let a=field(t('amount'),'number',100000),r=field(t('rate'),'number',12),o=field(t('result'));b.append(a.d,r.d,o.d,button(t('calculate'),()=>o.i.value=`VAT: ${(a.i.value*r.i.value/100).toLocaleString()} · Total: ${(a.i.value*(1+r.i.value/100)).toLocaleString()}`))}function bmiTool(b){let h=field('Height (cm)','number',170),w=field('Weight (kg)','number',70),o=field(t('result'));b.append(h.d,w.d,o.d,button(t('calculate'),()=>{let n=+w.i.value/(+h.i.value/100)**2;o.i.value=n.toFixed(1)+' — '+(n<18.5?t('underweight'):n<25?t('normal'):n<30?t('overweight'):t('obese'))}))}function ageTool(b){let f=field(t('birth'),'date'),o=field(t('yourAge'));b.append(f.d,o.d,button(t('calculate'),()=>{let d=new Date(f.i.value),now=new Date();let age=now.getFullYear()-d.getFullYear();if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))age--;o.i.value=age+' '+t('years')}))}
function textDiffTool(b){let a=field(lang==='ru'?'Первый текст':lang==='uz'?'1-matn':'Text A','textarea','',{rows:6}),c=field(lang==='ru'?'Второй текст':lang==='uz'?'2-matn':'Text B','textarea','',{rows:6}),out=document.createElement('div');out.className='status';b.append(a.d,c.d,button(t('apply'),()=>{let x=a.i.value.split(/\r?\n/),y=c.i.value.split(/\r?\n/);out.innerHTML='';let n=Math.max(x.length,y.length);for(let i=0;i<n;i++){let row=document.createElement('div');row.style.fontFamily='monospace';row.style.whiteSpace='pre-wrap';if(x[i]===y[i]){row.textContent='  '+(x[i]||'');}else{if(x[i]!==undefined){let r=document.createElement('div');r.textContent='− '+x[i];r.style.color='#ff7185';out.append(r)}if(y[i]!==undefined){let r=document.createElement('div');r.textContent='+ '+y[i];r.style.color='#36d6a5';out.append(r)}}} },'primary'),out)}
function typingTool(b){const samples={en:'The quick brown fox jumps over the lazy dog. Practice makes progress when you stay consistent.',ru:'Быстрая проверка скорости печати помогает тренироваться и улучшать точность каждый день.',uz:'Tez va aniq yozish ko‘nikmasi muntazam mashq orqali rivojlanadi.'};let sample=document.createElement('p');sample.className='status';sample.textContent=samples[lang]||samples.en;let f=field(lang==='ru'?'Введите текст здесь':lang==='uz'?'Matnni shu yerga yozing':'Type here','textarea','',{rows:5}),out=document.createElement('div');out.className='status';let started=null;f.i.oninput=()=>{if(!started&&f.i.value.length)started=Date.now();if(started){let sec=Math.max(1,(Date.now()-started)/1000),words=(f.i.value.trim().match(/\S+/g)||[]).length;out.textContent=`${Math.round(words/sec*60)} WPM · ${f.i.value.length} ${lang==='ru'?'символов':lang==='uz'?'belgi':'characters'}`}};b.append(sample,f.d,out,button(lang==='ru'?'Сбросить':lang==='uz'?'Qayta':'Reset',()=>{f.i.value='';started=null;out.textContent=''}))}
function timerTool(b){let n=field(lang==='ru'?'Секунды':lang==='uz'?'Sekund':'Seconds','number',60,{min:1}),out=document.createElement('div');out.className='status';let interval=null,remaining=60;function show(){out.textContent=(lang==='ru'?'Осталось: ':lang==='uz'?'Qoldi: ':'Remaining: ')+remaining+'s'}let startBtn=button(lang==='ru'?'Старт':lang==='uz'?'Boshlash':'Start',()=>{if(interval)return;remaining=Math.max(1,+n.i.value);show();interval=setInterval(()=>{remaining--;show();if(remaining<=0){clearInterval(interval);interval=null;out.textContent=lang==='ru'?'Время вышло!':lang==='uz'?'Vaqt tugadi!':'Time is up!'}},1000)});let stopBtn=button(lang==='ru'?'Стоп':lang==='uz'?'To‘xtatish':'Stop',()=>{clearInterval(interval);interval=null});let resetBtn=button(lang==='ru'?'Сброс':lang==='uz'?'Qayta':'Reset',()=>{clearInterval(interval);interval=null;remaining=+n.i.value;show()});b.append(n.d,startBtn,stopBtn,resetBtn,out)}
function pdfMergeTool(b){let f=field(lang==='ru'?'PDF-файлы (можно выбрать несколько)':lang==='uz'?'PDF fayllar (bir nechta)':'PDF files (select multiple','file','',{accept:'application/pdf',multiple:true}),out=document.createElement('div');out.className='status';let mergeBtn=button(lang==='ru'?'Объединить':lang==='uz'?'Birlashtirish':'Merge PDFs',async()=>{if(!f.i.files.length){out.textContent=t('invalid');return}out.textContent=lang==='ru'?'Обработка…':lang==='uz'?'Ishlanmoqda…':'Processing…';try{if(!window.PDFLib){await new Promise((resolve,reject)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js';sc.onload=resolve;sc.onerror=reject;document.head.append(sc)})}let PDFDocument=window.PDFLib.PDFDocument,merged=await PDFDocument.create();for(let file of f.i.files){let src=await PDFDocument.load(await file.arrayBuffer());let pages=await merged.copyPages(src,src.getPageIndices());pages.forEach(p=>merged.addPage(p))}downloadBlob(new Blob([await merged.save()],{type:'application/pdf'}),'merged.pdf');out.textContent=lang==='ru'?'Готово!':lang==='uz'?'Tayyor!':'Done!'}catch(e){out.textContent='Error: '+e.message}});mergeBtn.className='primary';b.append(f.d,mergeBtn,out);status(b,lang==='ru'?'PDF обрабатываются в браузере с использованием библиотеки.':'PDF processing runs in-browser using a library.')}

function jsonCsvTool(b){let f=field('JSON','textarea','',{rows:7}),o=field('CSV','textarea','',{rows:7});b.append(f.d,o.d,button(t('apply'),()=>{try{let a=JSON.parse(f.i.value);if(!Array.isArray(a)||!a.length)throw Error('Expected JSON array');let h=[...new Set(a.flatMap(x=>Object.keys(x)))],esc=v=>{let z=v==null?'':typeof v==='object'?JSON.stringify(v):String(v);return /[",\\n]/.test(z)?'"'+z.replace(/"/g,'""')+'"':z};o.i.value=[h.join(','),...a.map(x=>h.map(k=>esc(x[k])).join(','))].join('\\n')}catch(e){o.i.value=e.message}},'primary'),button(t('copy'),()=>copyText(o.i.value)))}
function csvJsonTool(b){let f=field('CSV','textarea','',{rows:7}),o=field('JSON','textarea','',{rows:7});b.append(f.d,o.d,button(t('apply'),()=>{try{let rows=f.i.value.trim().split(/\\r?\\n/),parse=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};let h=parse(rows.shift());o.i.value=JSON.stringify(rows.map(r=>{let v=parse(r),x={};h.forEach((k,i)=>x[k]=v[i]||'');return x}),null,2)}catch(e){o.i.value=e.message}},'primary'),button(t('copy'),()=>copyText(o.i.value)))}
function markdownTool(b){let f=field('Markdown','textarea','',{rows:8}),o=document.createElement('div');o.className='status';b.append(f.d,o);f.i.oninput=()=>{let z=f.i.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\\*\\*(.*?)\\*\\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^[-*] (.*)$/gm,'• $1').replace(/\\n/g,'<br>');o.innerHTML=z}}
function pdfSplitTool(b){let f=field(t('input'),'file','',{accept:'application/pdf'}),r=field(t('pageRange'),'text','1'),o=document.createElement('div');o.className='status';b.append(f.d,r.d,button(t('split'),async()=>{try{if(!f.i.files[0])throw Error('Choose PDF');await loadPdfLib();let src=await PDFLib.PDFDocument.load(await f.i.files[0].arrayBuffer()),doc=await PDFLib.PDFDocument.create(),ids=new Set();for(let p of r.i.value.split(',')){let [a,z]=p.trim().split('-').map(Number);z=z||a;if(a<1||z<a||z>src.getPageCount())throw Error('Invalid page range');for(let n=a;n<=z;n++)ids.add(n-1)}let pages=await doc.copyPages(src,[...ids]);pages.forEach(x=>doc.addPage(x));downloadBlob(new Blob([await doc.save()],{type:'application/pdf'}),'pages.pdf');o.textContent='Done'}catch(e){o.textContent=e.message}},'primary'),o)}
async function loadPdfLib(){if(window.PDFLib)return;await new Promise((ok,no)=>{let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';sc.onload=ok;sc.onerror=()=>no(Error('PDF library failed to load. Check internet connection.'));document.head.append(sc)})}
function imageToPdfTool(b){let f=field(t('upload'),'file','',{accept:'image/*',multiple:true}),o=document.createElement('div');o.className='status';b.append(f.d,button(t('apply'),async()=>{try{if(!f.i.files.length)throw Error('Choose images');await loadPdfLib();let doc=await PDFLib.PDFDocument.create();for(let file of f.i.files){let bytes=await file.arrayBuffer(),embed;if(file.type==='image/png')embed=await doc.embedPng(bytes);else{let im=await fileToImage(file),cv=document.createElement('canvas');cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);bytes=await new Promise(res=>cv.toBlob(res,'image/jpeg',.9));embed=await doc.embedJpg(await bytes.arrayBuffer())}let page=doc.addPage([embed.width,embed.height]);page.drawImage(embed,{x:0,y:0,width:embed.width,height:embed.height})}downloadBlob(new Blob([await doc.save()],{type:'application/pdf'}),'images.pdf');o.textContent='Done'}catch(e){o.textContent=e.message}},'primary'),o)}
function fileToImage(file){return new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
function faviconTool(b){let f=field(t('upload'),'file','',{accept:'image/*'}),o=document.createElement('div');b.append(f.d,o);f.i.onchange=()=>{let file=f.i.files[0];if(!file)return;let im=new Image();im.onload=()=>{let cv=document.createElement('canvas');cv.width=cv.height=256;let ctx=cv.getContext('2d'),side=Math.min(im.width,im.height);ctx.drawImage(im,(im.width-side)/2,(im.height-side)/2,side,side,0,0,256,256);let url=cv.toDataURL('image/png'),preview=document.createElement('img');preview.src=url;preview.className='preview';o.innerHTML='';o.append(preview,button(t('download'),()=>downloadBlob(dataURLBlob(url),'favicon.png'),'primary'))};im.src=URL.createObjectURL(file)}}
function dataURLBlob(u){let [h,d]=u.split(','),bin=atob(d),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:h.match(/:(.*?);/)[1]})}
function paletteTool(b){let f=field(t('upload'),'file','',{accept:'image/*'}),cv=document.createElement('canvas'),out=document.createElement('div');out.className='status';cv.style.maxWidth='100%';cv.style.cursor='crosshair';b.append(f.d,cv,out);f.i.onchange=()=>{let file=f.i.files[0];if(!file)return;let im=new Image();im.onload=()=>{cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);out.textContent='Click image to sample color';};im.src=URL.createObjectURL(file);};cv.onclick=(e)=>{let r=cv.getBoundingClientRect();let x=Math.floor((e.clientX-r.left)*cv.width/r.width);let y=Math.floor((e.clientY-r.top)*cv.height/r.height);let d=cv.getContext('2d').getImageData(x,y,1,1).data;let hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');out.textContent=hex+' RGB('+d[0]+','+d[1]+','+d[2]+')';out.append(button(t('copy'),()=>copyText(hex)));};}
function backgroundInfoTool(b){b.innerHTML=`<p>${t('backgroundDesc')}</p><p class=note>${lang==='ru'?'UzDevTools пока не подключает платный API удаления фона. Можно добавить локальную AI-модель в будущей версии.':'No background-removal API is connected yet; an on-device AI model could be added later.'}</p>`}
