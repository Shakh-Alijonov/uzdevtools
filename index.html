function renderCategories(){let cats=t('categories');$('#categories').innerHTML=cats.map((name,i)=>`<button class="cat ${category===(i===0?'All':['Images','Developer','Text','Converters','Generators','Calculators'][i-1])?'active':''}" data-cat="${i===0?'All':['Images','Developer','Text','Converters','Generators','Calculators'][i-1]}">${name}</button>`).join('');$('#categories').querySelectorAll('button').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCategories();renderGrid()})}
function renderGrid(){let q=$('#search').value.toLowerCase().trim();let list=tools.filter(x=>(category==='All'||x.cat===category)&&(!q||t(x.key).toLowerCase().includes(q)||t(x.desc).toLowerCase().includes(q)||x.id.includes(q)));$('#toolCount').textContent=list.length+' / '+tools.length;$('#grid').innerHTML=list.map(x=>`<article class="toolcard" data-id="${x.id}"><button class="fav ${favorites.includes(x.id)?'on':''}" data-fav="${x.id}" title="Favorite">${favorites.includes(x.id)?'♥':'♡'}</button><div class="tool-icon">${x.icon}</div><h3>${t(x.key)}</h3><p>${t(x.desc)}</p></article>`).join('')||`<p>${t('noResults')}</p>`;$('#grid').querySelectorAll('.toolcard').forEach(c=>c.onclick=e=>{if(e.target.closest('.fav'))return;openTool(c.dataset.id)});$('#grid').querySelectorAll('.fav').forEach(b=>b.onclick=e=>{e.stopPropagation();let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('udt-favs',JSON.stringify(favorites));renderGrid()})}
function openTool(id){selected=id;recent=[id,...recent.filter(x=>x!==id)].slice(0,6);localStorage.setItem('udt-recent',JSON.stringify(recent));let tool=tools.find(x=>x.id===id);$('#workspace').classList.add('open');$('#workTitle').textContent=t(tool.key);let b=$('#workBody');b.innerHTML='';if(id==='enhancer'||id==='compressor'||id==='resizer'||id==='converter'||id==='cropper'||id==='base64')imageTool(id,b);else if(['json','xml','html','css','js','sql'].includes(id))formatTool(id,b);else if(id==='regex')regexTool(b);else if(id==='url')urlTool(b);else if(id==='color')colorTool(b);else if(id==='units')unitsTool(b);else if(id==='date')dateTool(b);else if(id==='password')passwordTool(b);else if(id==='uuid')uuidTool(b);else if(id==='qr')qrTool(b);else if(id==='hash')hashTool(b);else if(id==='textcount')textCountTool(b);else if(id==='case')caseTool(b);else if(id==='clean')cleanTool(b);else if(id==='phone')phoneTool(b);else if(id==='percent')percentTool(b);else if(id==='vat')vatTool(b);else if(id==='bmi')bmiTool(b);else if(id==='age')ageTool(b);$('#workspace').scrollIntoView({behavior:'smooth',block:'start'})}
$('#close').onclick=()=>$('#workspace').classList.remove('open');$('#search').oninput=renderGrid;$('#language').onchange=e=>{lang=e.target.value;localStorage.setItem('udt-lang',lang);translate();if(selected)openTool(selected)};$('#theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem('udt-theme',document.body.classList.contains('light')?'light':'dark')};if(localStorage.getItem('udt-theme')==='light')document.body.classList.add('light');
function status(el,msg,cls=''){el.innerHTML=`<div class="status ${cls}">${msg}</div>`}function button(text,fn,cls=''){let b=document.createElement('button');b.textContent=text;b.className=cls;b.onclick=fn;return b}function field(label,type='text',value='',extra={}){let d=document.createElement('div');d.className='control';let l=document.createElement('label');l.textContent=label;let i=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');if(type!=='textarea'&&type!=='select')i.type=type;if(value!==undefined&&value!==null)i.value=value;Object.entries(extra).forEach(([k,v])=>i[k]=v);d.append(l,i);return {d,i}}function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function imageTool(id,b){b.innerHTML=`<div class="drop" id="drop">${t('drop')}<br><input type="file" id="file" accept="image/*" style="margin-top:12px"></div><p class="note">${t('local')}</p><div id="imgwork"></div>`;let drop=$('#drop'),file=$('#file');drop.addEventListener('dragover',e=>{e.preventDefault();drop.style.borderColor='var(--accent)'});drop.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])loadImage(e.dataTransfer.files[0],id)});file.onchange=()=>file.files[0]&&loadImage(file.files[0],id)}
function loadImage(file,id){if(!file.type.startsWith('image/'))return;let r=new FileReader();r.onload=()=>{originalImg=new Image();originalImg.onload=()=>{loadedImg=originalImg;imageControls(id)};originalImg.src=r.result};r.readAsDataURL(file)}function imageControls(id){let b=$('#imgwork');b.innerHTML=`<div class="cols"><div><img id="preview" class="preview" src="${originalImg.src}"><div class="note" id="dims">${t('size')}: ${originalImg.width} × ${originalImg.height}</div></div><div id="settings"></div></div>`;let s=$('#settings');if(id==='enhancer'){s.innerHTML='';[['brightness',0,-100,100],['contrast',0,-100,100],['saturation',0,-100,100],['sharpen',0,0,100],['denoise',0,0,30]].forEach(([key,val,min,max])=>{let f=field(t(key),'range',val,{min,max});f.i.oninput=()=>{f.d.querySelector('label').innerHTML=t(key)+' <span class="rangeval">'+f.i.value+'</span>';renderEnhanced()};s.append(f.d)});s.append(button(t('enhance'),()=>{s.querySelectorAll('input[type=range]').forEach((x,i)=>x.value=[8,10,8,20,5][i]);renderEnhanced()},'primary'),button(t('reset'),()=>{s.querySelectorAll('input[type=range]').forEach(x=>x.value=0);renderEnhanced()}));}else if(id==='resizer'){let wf=field(t('width'),'number',originalImg.width,{min:1}),hf=field(t('height'),'number',originalImg.height,{min:1}),ck=document.createElement('input');ck.type='checkbox';ck.checked=true;let lab=document.createElement('label');lab.textContent=t('keep');let row=document.createElement('div');row.append(ck,lab);wf.i.oninput=()=>{if(ck.checked)hf.i.value=Math.round(wf.i.value*originalImg.height/originalImg.width)};hf.i.oninput=()=>{if(ck.checked)wf.i.value=Math.round(hf.i.value*originalImg.width/originalImg.height)};s.append(wf.d,hf.d,row,button(t('apply'),()=>renderOutput(+wf.i.value,+hf.i.value,'image/png',1)),button(t('reset'),()=>renderOutput(originalImg.width,originalImg.height,'image/png',1)));}else if(id==='compressor'||id==='converter'){let q=field(t('quality'),'range',80,{min:10,max:100});let fm=field(t('format'),'select','image/jpeg');fm.i.innerHTML='<option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option>';s.append(q.d,fm.d,button(t('compress'),()=>renderOutput(originalImg.width,originalImg.height,fm.i.value,+q.i.value/100),'primary'));}else if(id==='cropper'){let f=field(t('crop'),'select','square');f.i.innerHTML='<option value="square">1:1</option><option value="landscape">16:9</option><option value="portrait">9:16</option><option value="4:3">4:3</option>';s.append(f.d,button(t('apply'),()=>cropOutput(f.i.value),'primary'));}else if(id==='base64'){s.append(button(t('apply'),()=>{$('#preview').src=originalImg.src;let out=document.createElement('textarea');out.className='output';out.value=originalImg.src;s.append(out,button(t('copy'),()=>copyText(out.value)));}));}s.append(button(t('download'),()=>downloadCurrent(),'primary'));}
let currentCanvas=null;function renderEnhanced(){let ranges=[...$('#settings').querySelectorAll('input[type=range]')],v=ranges.map(x=>+x.value),cv=document.createElement('canvas');cv.width=originalImg.width;cv.height=originalImg.height;let ctx=cv.getContext('2d');ctx.filter=`brightness(${100+v[0]}%) contrast(${100+v[1]}%) saturate(${100+v[2]}%)`;ctx.drawImage(originalImg,0,0);ctx.filter='none';if(v[3]>0)sharpenCanvas(ctx,cv,v[3]/100);currentCanvas=cv;$('#preview').src=cv.toDataURL();}
function sharpenCanvas(ctx,cv,amount){let w=cv.width,h=cv.height;if(w*h>4e6)return;let src=ctx.getImageData(0,0,w,h),dst=ctx.createImageData(w,h),d=src.data;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=(y*w+x)*4;for(let c=0;c<3;c++){let val=5*d[i+c]-d[i-4+c]-d[i+4+c]-d[i-4*w+c]-d[i+4*w+c];dst.data[i+c]=Math.max(0,Math.min(255,d[i+c]+(val-d[i+c])*amount));}dst.data[i+3]=d[i+3]}ctx.putImageData(dst,0,0)}function renderOutput(w,h,fmt,q){w=Math.max(1,w||originalImg.width);h=Math.max(1,h||originalImg.height);let cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(originalImg,0,0,w,h);currentCanvas=cv;$('#preview').src=cv.toDataURL();}function cropOutput(ratio){let w=originalImg.width,h=originalImg.height,ar=ratio==='square'?1:ratio==='landscape'?16/9:ratio==='portrait'?9/16:4/3;let cw=w,ch=h;if(w/h>ar)cw=h*ar;else ch=w/ar;let cv=document.createElement('canvas');cv.width=Math.round(cw);cv.height=Math.round(ch);cv.getContext('2d').drawImage(originalImg,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);currentCanvas=cv;$('#preview').src=cv.toDataURL()}function downloadCurrent(){let cv=currentCanvas||originalImg;if(cv instanceof HTMLImageElement){let c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;c.getContext('2d').drawImage(cv,0,0);cv=c}cv.toBlob(blob=>downloadBlob(blob,'uzdevtools-image.png'),'image/png')}function copyText(text){navigator.clipboard?.writeText(text).then(()=>alert(t('copied'))).catch(()=>{})}
function formatTool(id,b){let f=field(t('input'),'textarea','',{rows:9}),o=document.createElement('textarea');o.className='output';o.placeholder=t('result');b.append(f.d,button(t('apply'),()=>{try{let txt=f.i.value;if(id==='json')o.value=JSON.stringify(JSON.parse(txt),null,2);else if(id==='xml'||id==='html')o.value=formatMarkup(txt);else if(id==='css')o.value=txt.replace(/\s*([{};:,])\s*/g,'$1 ').replace(/\s*\{\s*/g,' {\n  ').replace(/;\s*/g,';\n  ').replace(/\s*}\s*/g,'\n}\n').trim();else if(id==='js')o.value=txt.replace(/\s*([{}])\s*/g,' $1\n').replace(/;\s*/g,';\n').trim();else o.value=txt.replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT JOIN|RIGHT JOIN|INNER JOIN|GROUP BY|ORDER BY|INSERT INTO|UPDATE|DELETE|VALUES|SET|AND|OR)\b/gi,'\n$1').trim();}catch(e){o.value=t('invalid')+': '+e.message}},'primary'),o,button(t('copy'),()=>copyText(o.value)));}function formatMarkup(x){return x.replace(/>\s*</g,'><').replace(/></g,'>\n<').trim()}
function regexTool(b){let p=field('Pattern'),flags=field('Flags','text','g'),txt=field(t('text'),'textarea','',{rows:5}),o=document.createElement('textarea');o.className='output';b.append(p.d,flags.d,txt.d,button(t('apply'),()=>{try{let r=new RegExp(p.i.value,flags.i.value);o.value=[...txt.i.value.matchAll(r)].map(x=>x[0]+' — index '+x.index).join('\n')||'No matches'}catch(e){o.value=e.message}},'primary'),o)}function urlTool(b){let f=field(t('input'),'textarea','',{rows:4}),o=document.createElement('textarea');o.className='output';b.append(f.d,button('Encode',()=>o.value=encodeURIComponent(f.i.value)),button('Decode',()=>{try{o.value=decodeURIComponent(f.i.value)}catch(e){o.value=e.message}}),o,button(t('copy'),()=>copyText(o.value)))}function colorTool(b){let f=field('HEX','text','#6677ff'),o=document.createElement('div');o.innerHTML='<div style="height:90px;border-radius:12px;margin:12px 0" id="swatch"></div>';let out=field(t('result'));b.append(f.d,o,out.d,button(t('apply'),()=>{let c=f.i.value.trim(),hex=c.startsWith('#')?c:'#'+c;if(/^#[0-9a-f]{6}$/i.test(hex)){let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),bl=parseInt(hex.slice(5,7),16);$('#swatch').style.background=hex;out.i.value=`RGB(${r}, ${g}, ${bl})`;}}));}function unitsTool(b){let f=field(t('value'),'number',1),sel=field('Convert','select','km-mi');sel.i.innerHTML='<option value="km-mi">km → miles</option><option value="mi-km">miles → km</option><option value="kg-lb">kg → lb</option><option value="lb-kg">lb → kg</option><option value="c-f">°C → °F</option><option value="f-c">°F → °C</option><option value="cm-in">cm → inches</option><option value="in-cm">inches → cm</option>';let o=field(t('result'));b.append(f.d,sel.d,o.d,button(t('calculate'),()=>{let n=+f.i.value,fn={'km-mi':n*.621371,'mi-km':n/0.621371,'kg-lb':n*2.20462,'lb-kg':n/2.20462,'c-f':n*9/5+32,'f-c':(n-32)*5/9,'cm-in':n/2.54,'in-cm':n*2.54};o.i.value=fn[sel.i.value].toFixed(4)}))}function dateTool(b){let a=field(t('date1'),'date'),c=field(t('date2'),'date'),o=field(t('result'));b.append(a.d,c.d,o.d,button(t('calculate'),()=>{if(a.i.value&&c.i.value)o.i.value=Math.abs((new Date(c.i.value)-new Date(a.i.value))/864e5)+' days'}))}function passwordTool(b){let n=field('Length','number',16,{min:4,max:128}),o=field(t('result'));b.append(n.d,o.d,button(t('apply'),()=>{let chars='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=';let arr=new Uint32Array(+n.i.value);crypto.getRandomValues(arr);o.i.value=Array.from(arr,x=>chars[x%chars.length]).join('')},'primary'),button(t('copy'),()=>copyText(o.i.value)))}function uuidTool(b){let o=field(t('result'));b.append(o.d,button(t('apply'),()=>o.i.value=crypto.randomUUID(),'primary'),button(t('copy'),()=>copyText(o.i.value)))}function qrTool(b){let f=field(t('input')),o=document.createElement('div');b.append(f.d,button(t('apply'),()=>{o.innerHTML='';let im=document.createElement('img');im.alt='QR code';im.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+encodeURIComponent(f.i.value);im.className='preview';o.append(im)},'primary'),o);status(b,t('local'))}async function hashTool(b){let f=field(t('input'),'textarea','',{rows:4}),o=field(t('result'));b.append(f.d,o.d,button(t('apply'),async()=>{let hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(f.i.value));o.i.value=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')},'primary'),button(t('copy'),()=>copyText(o.i.value)))}function textCountTool(b){let f=field(t('text'),'textarea','',{rows:7}),o=document.createElement('div');o.className='status';b.append(f.d,o);f.i.oninput=()=>{let x=f.i.value;o.innerHTML=`Characters: ${x.length}<br>Characters (no spaces): ${x.replace(/\s/g,'').length}<br>Words: ${(x.trim().match(/\S+/g)||[]).length}<br>Lines: ${x?x.split(/\r?\n/).length:0}`}}function caseTool(b){let f=field(t('text'),'textarea','',{rows:5}),o=field(t('result'),'textarea','',{rows:5});b.append(f.d,o.d,button('UPPERCASE',()=>o.i.value=f.i.value.toUpperCase()),button('lowercase',()=>o.i.value=f.i.value.toLowerCase()),button('Title Case',()=>o.i.value=f.i.value.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase())),button(t('copy'),()=>copyText(o.i.value)))}function cleanTool(b){let f=field(t('text'),'textarea','',{rows:5}),o=field(t('result'),'textarea','',{rows:5});b.append(f.d,o.d,button(t('apply'),()=>o.i.value=f.i.value.split(/\r?\n/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n'),'primary'),button(t('copy'),()=>copyText(o.i.value)))}function phoneTool(b){let f=field(t('input')),o=field(t('result'));b.append(f.d,o.d,button(t('apply'),()=>{let n=f.i.value.replace(/\D/g,'');if(n.startsWith('998'))n=n.slice(3);if(n.length===9)o.i.value=`+998 (${n.slice(0,2)}) ${n.slice(2,5)}-${n.slice(5,7)}-${n.slice(7)}`;else o.i.value=t('invalid')},'primary'))}function percentTool(b){let a=field('Percent (%)','number',10),c=field('Value','number',200),o=field(t('result'));b.append(a.d,c.d,o.d,button(t('calculate'),()=>o.i.value=(+a.i.value*+c.i.value/100).toString()))}function vatTool(b){let a=field(t('amount'),'number',100000),r=field(t('rate'),'number',12),o=field(t('result'));b.append(a.d,r.d,o.d,button(t('calculate'),()=>o.i.value=`VAT: ${(a.i.value*r.i.value/100).toLocaleString()} · Total: ${(a.i.value*(1+r.i.value/100)).toLocaleString()}`))}function bmiTool(b){let h=field('Height (cm)','number',170),w=field('Weight (kg)','number',70),o=field(t('result'));b.append(h.d,w.d,o.d,button(t('calculate'),()=>{let n=+w.i.value/(+h.i.value/100)**2;o.i.value=n.toFixed(1)+' — '+(n<18.5?t('underweight'):n<25?t('normal'):n<30?t('overweight'):t('obese'))}))}function ageTool(b){let f=field(t('birth'),'date'),o=field(t('yourAge'));b.append(f.d,o.d,button(t('calculate'),()=>{let d=new Date(f.i.value),now=new Date();let age=now.getFullYear()-d.getFullYear();if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))age--;o.i.value=age+' '+t('years')}))}
translate();
</script>
